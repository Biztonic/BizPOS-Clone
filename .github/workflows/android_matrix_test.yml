name: Android Multi-Version Matrix Test

on:
  workflow_dispatch:
    inputs:
      test_levels:
        description: 'Target API levels (comma-separated or all)'
        required: false
        default: 'all'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'

# Cancel in-flight runs if a newer commit is pushed to the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Build APK Once for all matrix runners
  # ============================================================================
  build_apk:
    name: Build Test APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter 3.29.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Upload Test APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bizpos-test-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 1

  # ============================================================================
  # 2. Multi-Android Version Emulator Matrix (Android 8, 10, 12, 14)
  # ============================================================================
  emulator_matrix_test:
    name: Android API ${{ matrix.api-level }} (${{ matrix.os-name }})
    needs: build_apk
    runs-on: macos-13 # macOS Intel runner has hardware virtualization enabled by default
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 26
            target: default
            os-name: 'Android 8.0 Oreo'
          - api-level: 29
            target: default
            os-name: 'Android 10 Q'
          - api-level: 31
            target: default
            os-name: 'Android 12 S'
          - api-level: 34
            target: google_apis
            os-name: 'Android 14 UpsideDownCake'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Download Test APK
        uses: actions/download-artifact@v4
        with:
          name: bizpos-test-apk
          path: build/app/outputs/flutter-apk/

      - name: AVD Cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api-level }}

      - name: Create AVD and Generate Snapshot Cache
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircuits/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for API ${{ matrix.api-level }}"

      - name: Run Test on Android ${{ matrix.api-level }}
        uses: reactivecircuits/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            echo "Waiting for emulator boot..."
            adb wait-for-device
            
            echo "Installing BizPOS APK on Android ${{ matrix.api-level }}..."
            adb install -r build/app/outputs/flutter-apk/app-debug.apk
            
            echo "Launching BizPOS..."
            adb shell monkey -p com.bizpos.clone -c android.intent.category.LAUNCHER 1
            sleep 6
            
            echo "Verifying process is alive..."
            APP_PID=$(adb shell pidof com.bizpos.clone)
            if [ -z "$APP_PID" ]; then
              echo "❌ ERROR: com.bizpos.clone crashed on startup on Android ${{ matrix.api-level }}!"
              adb logcat -d > logcat_crash_api_${{ matrix.api-level }}.txt
              exit 1
            fi
            echo "✅ Process is running cleanly with PID: $APP_PID"
            
            echo "Capturing screen..."
            mkdir -p screenshots
            adb exec-out screencap -p > screenshots/screen_android_${{ matrix.api-level }}.png
            
            echo "Checking SQLite initialization..."
            adb shell "run-as com.bizpos.clone ls -la databases/" || true
            
            echo "Dumping diagnostic logcat..."
            adb logcat -d -s flutter:V AndroidRuntime:E > logcat_api_${{ matrix.api-level }}.txt

      - name: Upload Screen & Logs for Android ${{ matrix.api-level }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.api-level }}-results
          path: |
            screenshots/
            logcat*.txt
          retention-days: 7
